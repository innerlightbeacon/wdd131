<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Thank you for submitting your product review. View your review submission count and continue sharing your feedback." />
  <meta name="author" content="Jackson Osei Kumi" />
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <script defer src="scripts/form.js"></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">
      <!-- Product Name -->
      <label for="productName">Product Name:</label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
        <!-- Product options will be inserted here dynamically -->
      </select>

      <!-- Overall Rating -->
      <fieldset>
        <legend>Overall Rating:</legend>
        <label><input type="radio" id="rating1" name="rating" value="1" required /> 1</label>
        <label><input type="radio" id="rating2" name="rating" value="2" /> 2</label>
        <label><input type="radio" id="rating3" name="rating" value="3" /> 3</label>
        <label><input type="radio" id="rating4" name="rating" value="4" /> 4</label>
        <label><input type="radio" id="rating5" name="rating" value="5" /> 5</label>
      </fieldset>

      <!-- Date of Installation -->
      <label for="installDate">Date of Installation:</label>
      <input type="date" id="installDate" name="installDate" required />

      <!-- Useful Features -->
      <fieldset>
        <legend>Useful Features (Check all that apply):</legend>
        <label><input type="checkbox" id="feature1" name="features" value="Easy Setup" /> Easy Setup</label><br>
        <label><input type="checkbox" id="feature2" name="features" value="Durability" /> Durability</label><br>
        <label><input type="checkbox" id="feature3" name="features" value="Energy Efficient" /> Energy Efficient</label><br>
        <label><input type="checkbox" id="feature4" name="features" value="Compact Design" /> Compact Design</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review:</label>
      <textarea id="review" name="review" rows="4" placeholder="Write your review here..."></textarea>

      <!-- User Name -->
      <label for="username">Your Name (optional):</label>
      <input type="text" id="username" name="username" />

      <!-- Submit -->
      <input type="submit" value="Post Review" />
    </form>
  </main>

  <footer>
    <p>&copy; 2025 | Jackson Osei Kumi | Ghana | Last Updated: <span id="lastModified"></span></p>
  </footer>

  <script>
    document.getElementById("lastModified").textContent = document.lastModified;
  </script>
</body>
</html>
