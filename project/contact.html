<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Jackson Osei Kumi" />
  <meta name="description" content="Contact page for Traditional Ghanaian Cuisine" />
  <title>Contact Us | Traditional Ghanaian Cuisine</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>

  <header>
    <h1 class="logo">Traditional Ghanaian Cuisine</h1>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dishes.html">Dishes</a></li>
        <li><a href="culture.html">Culture</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Contact Us</h2>
      <form id="contactForm" class="contact-form" aria-label="Contact Form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="topic">Topic:</label>
        <select id="topic" name="topic" required>
          <option value="">-- Select a topic --</option>
          <option value="suggestion">Recipe Suggestion</option>
          <option value="question">Question</option>
          <option value="feedback">Feedback</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
      <div id="thanksMessage" style="display: none; margin-top: 1rem;"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Jackson Osei Kumi | <a href="references.html">References</a></p>
  </footer>

  <script src="scripts/main.js"></script>
</body>
</html>
